<div class="container mt-4">

<!-- Encabezado con botón del carrito -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🛍️ Productos Destacados</h2>
        <button
        class="btn btn-warning position-relative"
        data-bs-toggle="modal"
        data-bs-target="#modalCarrito"
        >
        🛒 Ver Carrito
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        {{ carrito.length }}
        </span>
    </button>
</div>

<!-- Grid de productos -->
<div class="row">
    <div class="col-md-4 mb-4" *ngFor="let producto of productos">
        <div class="card h-100 shadow-sm">

        <img
            [src]="producto.img"
            [alt]="producto.nombre"
            class="card-img-top"
            style="height: 200px; object-fit: cover;"
        />

        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ producto.nombre }}</h5>
            <p class="card-text text-muted flex-grow-1">{{ producto.descripcion }}</p>
            <p class="fw-bold text-success fs-5">${{ producto.precio }}</p>

            <!-- Botón: cambia si ya está en el carrito -->
            <button
            class="btn w-100"
            [class.btn-primary]="!estaEnCarrito(producto)"
            [class.btn-secondary]="estaEnCarrito(producto)"
            [disabled]="estaEnCarrito(producto)"
            (click)="agregarAlCarrito(producto)"
            >
            {{ estaEnCarrito(producto) ? '✓ Agregado' : '+ Agregar al carrito' }}
            </button>
        </div>

            </div>
        </div>
    </div>

</div>

<!-- ===== MODAL CARRITO ===== -->
<div class="modal fade" id="modalCarrito" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header bg-warning">
                <h5 class="modal-title">🛒 Tu Carrito</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

    <div class="modal-body">

        <!-- Carrito vacío -->
        <div *ngIf="carrito.length === 0" class="text-center text-muted py-4">
            <p class="fs-5">No hay productos en el carrito.</p>
        </div>

        <!-- Lista de productos en el carrito -->
        <div *ngIf="carrito.length > 0">
        <div
            class="d-flex align-items-center border-bottom py-3"
            *ngFor="let item of carrito"
        >
            <img
            [src]="item.img"
            [alt]="item.nombre"
            style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px;"
            />
            <div class="ms-3 flex-grow-1">
                <h6 class="mb-0">{{ item.nombre }}</h6>
                <small class="text-muted">{{ item.descripcion }}</small>
            </div>
                <span class="fw-bold text-success me-3">${{ item.precio }}</span>
                <button
                class="btn btn-sm btn-outline-danger"
                (click)="eliminarDelCarrito(item)"
                >✕</button>
            </div>
        </div>

    </div>

        <!-- Footer con total -->
        <div class="modal-footer d-flex justify-content-between" *ngIf="carrito.length > 0">
            <span class="fs-5 fw-bold">Total: <span class="text-success">${{ total }}</span></span>
            <button class="btn btn-success">Confirmar compra</button>
        </div>

        </div>
    </div>
</div>
