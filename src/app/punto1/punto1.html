<div class="container mt-4">
    <h2 class="text-center mb-4">📅 Eventos Disponibles</h2>

    <!-- Slide principal -->
    <div class="card shadow-lg overflow-hidden">

    <!-- Imagen del evento -->
    <div class="slide-img-wrapper">
        <img
        [src]="eventoActual.img"
        [alt]="eventoActual.nombre"
        class="slide-img"
        />
        <!-- Overlay oscuro para que el texto se lea mejor -->
            <div class="slide-overlay">
                <h3 class="text-white fw-bold">{{ eventoActual.nombre }}</h3>
                <p class="text-white">{{ eventoActual.descripcion }}</p>
            </div>
    </div>

    <!-- Botones de navegación y contador -->
    <div class="card-footer d-flex justify-content-between align-items-center bg-dark">

        <!-- Botón anterior -->
        <button class="btn btn-outline-light" (click)="anterior()">
        &#8592; Anterior
        </button>

        <!-- Dots indicadores -->
        <div class="d-flex gap-2">
            <span
                *ngFor="let evento of eventos; let i = index"
                class="dot"
                [class.dot-activo]="i === indiceActual"
                (click)="irA(i)"
            ></span>
        </div>

        <!-- Contador -->
        <span class="text-white">
            {{ indiceActual + 1 }} / {{ eventos.length }}
        </span>

        <!-- Botón siguiente -->
        <button class="btn btn-outline-light" (click)="siguiente()">
            Siguiente &#8594;
        </button>

    </div>
</div>

    <!-- Lista de eventos debajo (opcional, muestra todos) -->
    <div class="row mt-5">
        <h4 class="mb-3">Todos los eventos</h4>
    <div
        class="col-md-4 mb-3"
        *ngFor="let evento of eventos; let i = index"
    >
        <div
            class="card h-100 shadow-sm evento-card"
            [class.border-primary]="i === indiceActual"
            (click)="irA(i)"
            style="cursor: pointer"
        >
        <img [src]="evento.img" class="card-img-top" style="height: 150px; object-fit: cover;" [alt]="evento.nombre"/>
        <div class="card-body">
            <h6 class="card-title">{{ evento.nombre }}</h6>
            <p class="card-text text-muted small">{{ evento.descripcion }}</p>
        </div>
        </div>
    </div>
</div>
</div>
